{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>
        {% block title %}
            Админ панель
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'admin_panel/css/admin.css' %}">
     {% block extra_css %}{% endblock %}
</head>

<body>

<div class="admin-wrapper">

    <aside class="sidebar">

        <h2 class="logo">
            Admin Panel
        </h2>

        <nav>

            <a href="{% url 'admin_panel:dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'admin_panel:product_list' %}">
                Товары
            </a>

            <a href="{% url 'admin_panel:product_create' %}">
                Добавить товар
            </a>

            <a href="{% url 'admin_panel:reports' %}">
                Отчеты
            </a>

            <a href="{% url 'admin_panel:dictionaries' %}">
                Справочники
            </a>

            <a href="{% url 'account:logout' %}">
                Выйти
            </a>

        </nav>

    </aside>

    <main class="admin-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>
</html>

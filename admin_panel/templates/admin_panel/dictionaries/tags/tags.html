{% extends 'admin_panel/base.html' %}

{% block content %}

<h1>Теги</h1>

<a href="{% url 'admin_panel:tag_create' %}" class="btn">
    + Добавить тег
</a>

<div class="list">

    {% for tag in tags %}
        <div class="list-item">

            <span>{{ tag.name }}</span>

            <a href="{% url 'admin_panel:tag_delete' tag.id %}">
                Удалить
            </a>

        </div>
    {% empty %}
        <p>Тегов пока нет</p>
    {% endfor %}

</div>

{% endblock %}

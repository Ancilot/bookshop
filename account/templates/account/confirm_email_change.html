{% extends 'shop/base.html' %}

{% block content %}
<div class="auth-container">

    <h1>Подтверждение смены email</h1>

    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Подтвердить</button>
    </form>

</div>
{% endblock %}
